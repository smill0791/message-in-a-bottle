# Message in a Bottle - CI/CD
#
# CI runs on every push and has no AWS dependency at all.
# CD runs on main, and only does something when the stack is actually up.
#
# ---------------------------------------------------------------------------
# Why deploy is conditional rather than unconditional
#
# This stack costs roughly $0.10/hour and is destroyed at the end of every
# working session - that teardown is the cost control, not an afterthought. So
# for most of any given week there is nothing running for a merge to reach.
#
# The deploy job therefore checks whether the Auto Scaling group exists. If it
# does, the merge reaches AWS with no manual step, which is the point. If it
# does not, the job says so and succeeds, because "no environment is currently
# running" is not a broken build.
#
# Bringing the stack up and taking it down are manual buttons. Spending money
# should be a decision, not a side effect of merging.
# ---------------------------------------------------------------------------

stages:
  - test
  - deploy
  - stack

# One pipeline per change, not two.
#
# Without this, pushing to a branch that has an open merge request starts both
# a branch pipeline and a merge request pipeline - the same jobs twice, burning
# double the runner minutes. GitLab.com's free tier is 400 minutes a month, so
# this is not a cosmetic concern.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

variables:
  AWS_REGION: us-east-2
  AWS_DEFAULT_REGION: us-east-2

  # Terraform's provider profile must be empty in CI. The default is
  # aws-dev-project, which exists only in the developer's ~/.aws/config;
  # naming it on a runner fails before anything is planned.
  TF_VAR_aws_profile: ""

  # Nothing here reads history, so avoid cloning it.
  GIT_DEPTH: "20"

# --------------------------------------------------------------- templates --

# Assume a role, per job.
#
# ---------------------------------------------------------------------------
# This was meant to be OIDC, and could not be.
#
# `terraform apply` on 2026-08-29 was refused:
#
#   AccessDenied: not authorized to perform iam:CreateOpenIDConnectProvider
#   ... with an explicit deny in a service control policy (p-iyptwjyf)
#
# That SCP belongs to the AWS-managed organization that every Free Plan account
# sits inside, and cannot be edited from the account. Federation is simply
# unavailable here. infra/bootstrap keeps the OIDC code behind `enable_oidc`,
# ready if the account is ever upgraded.
#
# The fallback keeps as much of the design as possible. GitLab holds one access
# key belonging to a user whose entire policy is sts:AssumeRole on two roles -
# it can do nothing else at all. Each job trades that key for a one-hour
# session as whichever role it needs, so the permissions still arrive as
# short-lived credentials and every use is attributable in CloudTrail to a
# named pipeline and job.
#
# What is genuinely lost: OIDC pinned the exact branch of the exact project in
# the trust policy. Here that is enforced by marking the GitLab variables
# Protected, which is weaker - it is a GitLab setting rather than an AWS one.
#
# Still no shared credential cache anywhere, which matters: the two local AWS
# profiles share a login session and rotate each other's refresh token, and
# parallel jobs sharing one cached session would hit that permanently.
# ---------------------------------------------------------------------------
.aws_auth:
  before_script:
    # POSIX sh, not bash: the runner picks the job shell before before_script
    # installs anything, so this block cannot rely on bash being present.
    - |
      if [ -z "${AWS_ROLE_ARN:-}" ] || [ -z "${AWS_ACCESS_KEY_ID:-}" ]; then
        echo "AWS credentials are not configured for this job."
        echo "Apply infra/bootstrap, then add its outputs as CI/CD variables:"
        echo "  AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,"
        echo "  AWS_DEPLOY_ROLE_ARN, AWS_TERRAFORM_ROLE_ARN"
        echo "All must be Protected, and the secret key Masked."
        exit 1
      fi
    - |
      echo "assuming $AWS_ROLE_ARN"
      creds=$(aws sts assume-role \
        --role-arn "$AWS_ROLE_ARN" \
        --role-session-name "gitlab-${CI_PIPELINE_ID}-${CI_JOB_ID}" \
        --duration-seconds 3600 \
        --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
        --output text)

      # Three tab-separated fields. Checked rather than assumed, because empty
      # credentials do not fail loudly - every later call just returns
      # AccessDenied, which looks like a policy problem and is not.
      if [ "$(printf '%s' "$creds" | awk '{print NF}')" != "3" ]; then
        echo "assume-role did not return usable credentials"
        exit 1
      fi

      # Overwrites the long-lived key for the rest of the job, so nothing
      # downstream can accidentally act as the user rather than the role.
      AWS_ACCESS_KEY_ID=$(printf '%s' "$creds" | cut -f1)
      AWS_SECRET_ACCESS_KEY=$(printf '%s' "$creds" | cut -f2)
      AWS_SESSION_TOKEN=$(printf '%s' "$creds" | cut -f3)
      export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
    - aws sts get-caller-identity

# ------------------------------------------------------------------- test --

# Lint, typecheck, build and unit tests. No database, no AWS, no secrets -
# so it runs on every branch and on forks.
build:
  stage: test
  image: node:22
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run lint
    - npm run typecheck
    - npm test
    # Builds both workspaces and produces dist/app.tar.gz.
    - ./scripts/package.sh --no-upload
  artifacts:
    # Built once, here, and deployed as-is.
    #
    # Rebuilding in the deploy job would mean the bytes that were tested and
    # the bytes that reach production are two different compilations - almost
    # always identical, and the one time they are not is a bug that cannot be
    # reproduced from CI. It also keeps the Node toolchain out of the deploy
    # job entirely.
    paths:
      - dist/app.tar.gz
    expire_in: 1 week

# The 60-check end-to-end suite against a real Postgres.
#
# This is the test that actually means something here: it drives the real HTTP
# surface through register, write, moderate, discover, open, rate, keep and
# report. The unit tests above cover pure logic only.
e2e:
  stage: test
  image: node:22
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: bottle
    POSTGRES_PASSWORD: localdev
    POSTGRES_DB: bottle
    # The service is reachable by alias, not on localhost. e2e.sh reads this
    # and uses a real psql client rather than `docker exec`, which cannot work
    # against a service container.
    DATABASE_URL: "postgres://bottle:localdev@postgres:5432/bottle"
    DATABASE_SSL: "false"
    NODE_ENV: development
    HOST: 127.0.0.1
    PORT: "3000"
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull
  before_script:
    # postgresql-client supplies psql, which is what lib/db.sh reaches for
    # first; curl drives the API.
    - apt-get update -qq && apt-get install -y -qq postgresql-client curl >/dev/null
    - |
      echo "waiting for postgres..."
      for i in $(seq 1 30); do
        pg_isready -h postgres -U bottle -d bottle >/dev/null 2>&1 && break
        if [ "$i" = "30" ]; then echo "postgres never became ready"; exit 1; fi
        sleep 1
      done
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run db:migrate
    # Run the compiled output, not `npm run dev`.
    #
    # The dev script is `tsx watch`, which is wrong twice in CI: a file watcher
    # has nothing to watch, and it runs the TypeScript sources rather than the
    # JavaScript that actually ships. Testing the build output means the thing
    # under test is the thing that gets deployed.
    - npm run build --workspace api
    - node api/dist/index.js &
    - |
      echo "waiting for the API to listen..."
      for i in $(seq 1 60); do
        if curl -sf "http://127.0.0.1:3000/api/healthz" >/dev/null; then
          echo "up after ${i}s"; break
        fi
        if [ "$i" = "60" ]; then echo "API never became healthy"; exit 1; fi
        sleep 1
      done
    - ./scripts/e2e.sh

# ----------------------------------------------------------------- deploy --

# Publish the artifact and roll the fleet onto it - but only if there is a
# fleet. Runs automatically on main, after the tests pass.
deploy:
  stage: deploy
  # Alpine, not node: this job ships a prebuilt tarball and calls two AWS
  # APIs. It needs no JavaScript toolchain at all. Alpine's aws-cli package is
  # genuine v2, which Debian's is not.
  image: alpine:3.20
  extends: .aws_auth
  variables:
    AWS_ROLE_ARN: $AWS_DEPLOY_ROLE_ARN
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  needs:
    - job: build
      artifacts: true
    - job: e2e
  before_script:
    - apk add --no-cache aws-cli jq curl bash >/dev/null
    - !reference [.aws_auth, before_script]
  script:
    - |
      # Tag lookup, because the ASG name carries a generated suffix from
      # name_prefix and changes on every rebuild.
      ASG=$(aws autoscaling describe-auto-scaling-groups \
              --filters "Name=tag:Project,Values=bottle" \
              --region "$AWS_REGION" \
              --query 'AutoScalingGroups[0].AutoScalingGroupName' \
              --output text)

      if [ -z "$ASG" ] || [ "$ASG" = "None" ]; then
        echo "=================================================="
        echo " No stack is running. Nothing to deploy."
        echo ""
        echo " This is expected: the stack is destroyed after"
        echo " every session to control cost. Run the manual"
        echo " stack:up job to bring it back - that publishes"
        echo " this same artifact as part of coming up."
        echo "=================================================="
        exit 0
      fi

      echo "found $ASG"
      export ASG_NAME="$ASG"

      ./scripts/slack-notify.sh --status start \
        "Deploying *${CI_COMMIT_SHORT_SHA}* to AWS"

      # The tarball came from the build job. --upload-only publishes those
      # exact bytes rather than compiling a second time.
      ./scripts/package.sh --upload-only
      ./scripts/deploy.sh

      URL=$(cat .deploy-url 2>/dev/null || echo "")
      ./scripts/slack-notify.sh --status ok \
        "Deployed *${CI_COMMIT_SHORT_SHA}* to AWS" "$URL"
  after_script:
    # Only fires on failure. Kept out of `script` so that a failing deploy
    # still reports, rather than dying before it can say anything.
    - |
      if [ "$CI_JOB_STATUS" != "success" ]; then
        ./scripts/slack-notify.sh --status fail \
          "Deploy of *${CI_COMMIT_SHORT_SHA}* failed" || true
      fi

# ------------------------------------------------------------------ stack --

# Manual, because these are the jobs that cost money.
#
# Both use the broader terraform role rather than the deploy role. That role
# can create and destroy infrastructure, which is exactly why it is not on any
# automatic path.
.terraform_job:
  stage: stack
  image:
    name: hashicorp/terraform:1.16
    entrypoint: [""]
  extends: .aws_auth
  variables:
    AWS_ROLE_ARN: $AWS_TERRAFORM_ROLE_ARN
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  before_script:
    - apk add --no-cache aws-cli bash jq curl >/dev/null
    - !reference [.aws_auth, before_script]
    # -lock-timeout so a run that collides with another waits instead of
    # failing outright. An interrupted apply leaves a lock in the state bucket
    # that has to be cleared by hand.
    - cd infra && terraform init -input=false

stack:up:
  extends: .terraform_job
  # allow_failure: true, so the pipeline is not held hostage by a button.
  #
  # With false, GitLab treats a manual job as *blocking*: the pipeline never
  # reaches "passed", it sits waiting for a click that will not come on the
  # vast majority of commits. Every merge would show as blocked forever.
  #
  # The loudness this gives up is smaller than it looks. A failed job still
  # goes red on its own, and the after_script below announces it in Slack -
  # which is what actually reaches you, since nobody is watching a pipeline
  # badge at the moment an apply falls over.
  allow_failure: true
  needs:
    - job: build
      artifacts: true
  script:
    # Three steps, not one, and the order is the whole point.
    #
    # Instances download the application artifact from S3 in user data, at
    # first boot. A single `terraform apply` on a fresh account creates the
    # bucket and the Auto Scaling group in the same run, so the instances come
    # up, find an empty bucket, fail their bootstrap, fail the ELB health
    # check, and get replaced - forever, while billing.
    #
    # So: create the bucket, put the artifact in it, then build everything
    # else.
    - echo "=== 1/3 artifact bucket ==="
    - terraform apply -auto-approve -input=false -lock-timeout=5m -target=aws_s3_bucket.artifacts
    - echo "=== 2/3 publish the artifact ==="
    - cd .. && ./scripts/package.sh --upload-only && cd infra
    - echo "=== 3/3 the rest of the stack ==="
    - terraform apply -auto-approve -input=false -lock-timeout=5m
    # A dotenv report, because environment:url cannot read a plain file, and
    # the ALB hostname is generated so it cannot be hardcoded here.
    - echo "STACK_URL=$(terraform output -raw url)" > ../deploy.env
    - cd ..
    - . ./deploy.env
    - ./scripts/slack-notify.sh --status ok "Stack is up" "$STACK_URL"
  after_script:
    # A failed apply is the dangerous one: it can leave a NAT gateway, an RDS
    # instance and a load balancer running while reporting nothing. The job
    # goes red, but red jobs are only seen by someone already looking.
    - |
      if [ "$CI_JOB_STATUS" != "success" ]; then
        ./scripts/slack-notify.sh --status fail \
          "STACK:UP FAILED - resources may be half-built and billing. Run stack:down." || true
      fi
  artifacts:
    reports:
      dotenv: deploy.env
  environment:
    name: aws
    url: $STACK_URL
    # Gives GitLab a stop action, so the environment can also be torn down
    # from the environments page.
    on_stop: stack:down

stack:down:
  extends: .terraform_job
  # See stack:up. A failed destroy is the most expensive failure in this
  # project - a forgotten NAT gateway is ~$33/month against a $120 credit
  # balance - but the alarm that matters is the Slack message in after_script,
  # not the pipeline's overall status. Blocking every pipeline forever to keep
  # a badge honest is the wrong trade.
  allow_failure: true
  # Depends on nothing, deliberately.
  #
  # Teardown has to be reachable at all times. With the default stage
  # dependencies a failing lint or a broken test would block the one job that
  # stops the meter running, which is precisely backwards: the worse the state
  # of the branch, the more likely you need to destroy the stack.
  needs: []
  script:
    - terraform destroy -auto-approve -input=false -lock-timeout=5m
    - cd ..
    - ./scripts/slack-notify.sh --status ok "Stack destroyed. Nothing billable left running."
  after_script:
    - |
      if [ "$CI_JOB_STATUS" != "success" ]; then
        ./scripts/slack-notify.sh --status fail \
          "TEARDOWN FAILED - resources may still be running and billing" || true
      fi
  environment:
    name: aws
    action: stop
